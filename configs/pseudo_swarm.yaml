source_dataset: visdrone_vid
source_root: data/visdrone
output_root: data/swarm/pseudo_visdrone

agents:
  - id: agent_1
    transform:
      type: identity

  - id: agent_2
    transform:
      type: affine
      shift_x: 20
      shift_y: -10
      scale: 0.98
      rotate_deg: 1.0
      brightness_delta: 0.05

  - id: agent_3
    transform:
      type: affine
      shift_x: -25
      shift_y: 15
      scale: 1.03
      rotate_deg: -1.0
      brightness_delta: -0.05

synchronization:
  mode: same_frame_id

projection:
  reference_agent: agent_1
  use_known_transform: true

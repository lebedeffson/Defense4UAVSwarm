seed: 42
device: auto

dataset:
  root: data/visdrone
  name: VisDrone2019-VID
  fallback_name: VisDrone2019-MOT
  split: official_val_or_custom
  custom_val_ratio: 0.2
  split_file: configs/visdrone_split.yaml

model:
  name: yolov8n
  weights: yolov8n.pt
  tracker: bytetrack.yaml
  imgsz: 640
  conf: 0.05
  iou: 0.7
  max_det: 300

models:
  - name: yolov8n
    weights: yolov8n.pt
  - name: yolov8s
    weights: yolov8s.pt
  - name: yolov8m
    weights: yolov8m.pt

fgsm:
  enabled: true
  loss: class_only
  proxy_beta: 1.0
  eps_values: [0.002, 0.004, 0.008, 0.016]
  cache_dir: outputs/fgsm_cache

filtering:
  confidence_grid: [0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80]
  tau_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]
  det_tau_grid: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50]
  t_norms: [T_min, T_prod, T_Lukasiewicz]
  alpha: auto
  preassociation_kinematics: true
  gamma_assoc: 0.2
  gamma_assoc_grid: [0.05, 0.10, 0.20, 0.30]
  k_new_track: 1.0
  tau_soft_update: 0.05
  soft_conf_floor: 0.03
  soft_conf_floor_grid: [0.01, 0.03, 0.05]
  confirmed_conf_floor: 0.03
  confirmed_conf_floor_grid: [0.03, 0.05]
  confirm_age: 3
  confirm_age_grid: [3, 5]
  max_confirm_missed: 1
  tau_existing_grid: [0.05, 0.10, 0.15, 0.20]
  tau_new_grid: [0.15, 0.20, 0.25, 0.30, 0.35]
  risk_tau_grid: [0.50, 0.60, 0.70, 0.80]
  new_conf_tau_grid: [0.10, 0.15, 0.20, 0.25, 0.30]
  risk_weights: [0.40, 0.30, 0.30]
  reject_patience: 1
  reject_patience_grid: [1, 2, 3]
  max_missed_frames: 5
  min_attack_rejection_rate: 0.005
  k_variant: center
  k_variants: [center, iou, combined, gate, robust_min]
  alpha_scale: 1.0
  alpha_scales: [0.10, 0.15, 0.20, 0.30, 0.40, 0.50, 0.75, 1.00]
  betas: [0.5, 0.7, 0.9]
  robust_tau_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.50]
  robust_clean_f1_drop_limit: 0.02
  robust_clean_f1_drop_fallback: 0.03
  robust_recall_drop_limit: 0.03
  robust_score_weights:
    F1_attack: 0.30
    IDF1_attack: 0.25
    ASR_any: -0.15
    IDSW_rate: -0.15
    track_break_rate: -0.10
    clean_F1_drop: -0.05
  tie_eps: 0.01
  s_feature_mode: neutral_single_camera
  recall_drop_limit: 0.10
  tnorm_filter_mode: hard
  new_track_k_neutral_age: 3

evaluation:
  class_agnostic: true
  prediction_class_filter: [person, bicycle, car, motorcycle, bus, truck]
  prediction_class_filter_mode: drop

xai:
  enabled: false
  method: gradcam
  fallback_method: eigencam
  c_low: 0.5
  sigma_k: 0.3
  max_per_frame: 5
  examples_dir: outputs/xai_examples

outputs:
  results_dir: outputs/results
  figures_dir: outputs/figures

class_groups_file: configs/class_groups.yaml
class_mapping_file: configs/class_mapping_coco_to_visdrone.yaml

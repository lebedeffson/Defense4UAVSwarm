dataset_root: data/visdrone/VisDrone2019-VID-val
feature_audit: outputs/results/q1_final_corrected/yolov8s_main/feature_audit.csv
detector: yolov8s
tracker: bytetrack
matching_mode: coarse_class
ignore_policy: exclude_ignored
iou_threshold: 0.5
analysis_scope: candidate_space_feature_audit

legacy_thresholds:
  q_threshold: 0.20
  m_of_n_confidence: 0.10

trust_guard:
  mode: operational
  absolute_confidence_floor: 0.07
  relative_confidence_weight: 0.30
  relative_confidence_window: 500
  relative_confidence_min_history: 30
  evidence_decay: 0.60
  confirmation_threshold: 0.55
  minimum_valid_hits: 2
  maximum_pending_age: 6
  maximum_consecutive_misses: 2
  kinematic_veto_threshold: 0.12
  geometric_veto_threshold: 0.12
  veto_penalty: 0.35
  maximum_consecutive_vetoes: 2
  strict_threshold: 0.55
  position_scale: 0.75
  area_scale: 0.60
  use_relative_confidence: true
  use_kinematic: true
  use_geometric: false
  use_veto: true
  use_evidence: true

shift_grid:
  temperature: [0.75, 1.0, 1.25]
  bias: [-0.50, -0.25, 0.0, 0.25, 0.50]
